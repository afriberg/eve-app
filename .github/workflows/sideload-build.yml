name: Sideload build (free, no paid account)

# Manual only. Produces an UNSIGNED .ipa build artifact — no Apple Developer
# Program membership, no App Store Connect, no cost at all. You sign it
# yourself on your own computer with a free Apple ID using AltStore or
# Sideloadly, and install it straight onto your iPhone over USB or Wi-Fi.
# See docs/sideloading.md for the full walkthrough and the 7-day re-sign
# limit that comes with a free (non-paid) Apple ID.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        env:
          # Unsigned build: no team, no signing style needed here.
          DEVELOPMENT_TEAM: ""

      - name: Build unsigned .app for a real device
        run: |
          xcodebuild \
            -project EVE.xcodeproj \
            -scheme EVE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/EVE.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r EVE-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVE-unsigned-ipa
          path: EVE-unsigned.ipa
          retention-days: 14
