name: EVE
options:
  bundleIdPrefix: com.eve-app
  developmentLanguage: sv
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  EVE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVE
    info:
      path: EVE/Resources/Info.plist
      properties:
        CFBundleDisplayName: EVE
        CFBundleDevelopmentRegion: sv
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "EVE behöver mikrofonen för att höra vad du säger."
        NSSpeechRecognitionUsageDescription: "EVE behöver taligenkänning för att förstå vad du säger."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eve-app.eve
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        # Injected from the DEVELOPMENT_TEAM environment variable at
        # `xcodegen generate` time (XcodeGen's ${VAR} env-substitution) so no
        # Apple Team ID is hardcoded in the repo. Unset for the regular CI
        # simulator build/test job (ci.yml) — simulator destinations don't
        # need signing. Set by .github/workflows/testflight.yml from the
        # APPLE_TEAM_ID secret for real device/TestFlight archives.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
  EVETests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVETests
    dependencies:
      - target: EVE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eve-app.eve.tests
        GENERATE_INFOPLIST_FILE: YES
  EVEUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVEUITests
    dependencies:
      - target: EVE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eve-app.eve.uitests
        TEST_TARGET_NAME: EVE
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EVE:
    build:
      targets:
        EVE: all
    test:
      config: Debug
      targets:
        - EVETests
        - EVEUITests
    run:
      config: Debug
