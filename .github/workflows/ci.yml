name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Xcode/xcodebuild require a macOS runner; no secrets are used anywhere
    # in this workflow (brief §32).
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # project.yml references ${DEVELOPMENT_TEAM} (XcodeGen env-substitution)
      # for the TestFlight/device workflow — explicitly empty here so
      # `xcodegen generate` never depends on an undefined variable. Simulator
      # builds don't need a signing team at all.
      DEVELOPMENT_TEAM: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # A hardcoded device name (e.g. "iPhone 16") breaks whenever GitHub's
      # macOS runner image rotates its pre-installed simulator set — which
      # it does periodically, independent of anything in this repo. Look up
      # whatever iPhone simulator actually exists on this runner instead.
      - name: Find an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for d in devices:
        if d['name'].startswith('iPhone'):
            print(d['name'])
            sys.exit(0)
sys.exit('No available iPhone simulator found on this runner.')
")
          echo "Using simulator: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -project EVE.xcodeproj -scheme EVE \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device_name }}" \
            build

      - name: Unit + UI tests
        run: |
          xcodebuild -project EVE.xcodeproj -scheme EVE \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device_name }}" \
            test
