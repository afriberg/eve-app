name: Repo guard (secrets + infra keywords)

# This repository is public. This workflow is the automated backstop for
# docs/security.md's principle "no hardcoded API tokens, passwords,
# certificates, or private keys in this repository, ever" and for keeping
# real internal service/product names (see .github/repo-guard-denylist.txt)
# out of docs and code as new features (e.g. a services dashboard) are
# added. A hit fails the build — this is meant to be a hard stop, not a
# warning.
#
# Written in PowerShell rather than bash: this runs on ROGSTRIX, a Windows
# self-hosted runner, and Windows PowerShell (powershell.exe) ships with
# every Windows install — no dependency on Git Bash's install path or PATH
# configuration, which caused repeated failures with a bash-based version
# of this script.
on:
  push:
  pull_request:

jobs:
  scan:
    # Self-hosted (see docs/testflight.md/sideloading.md's Xcode workflows
    # for why those stay on macos-15 instead: this job needs no Xcode, so
    # it's the one workflow that can safely run anywhere).
    runs-on: ROGSTRIX
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block denylisted infra/service keywords
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = git ls-files
          $denylist = Get-Content ".github/repo-guard-denylist.txt" | Where-Object { $_ -and -not $_.StartsWith('#') }
          $hits = 0
          foreach ($pattern in $denylist) {
            foreach ($file in $files) {
              if ($file -eq ".github/repo-guard-denylist.txt") { continue }
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }
              $found = Select-String -LiteralPath $file -Pattern ([regex]::Escape($pattern)) -CaseSensitive:$false -ErrorAction SilentlyContinue
              if ($found) {
                Write-Host "::error::Denylisted term '$pattern' found in ${file}:"
                foreach ($m in $found) { Write-Host "  line $($m.LineNumber): $($m.Line.Trim())" }
                $hits = 1
              }
            }
          }
          exit $hits

      - name: Block obvious secret material
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = git ls-files
          $hits = 0
          $checks = @(
            @{ Desc = "PEM private key block"; Pattern = '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----' },
            @{ Desc = "AWS access key ID"; Pattern = 'AKIA[0-9A-Z]{16}' },
            @{ Desc = "GitHub token"; Pattern = 'gh[pousr]_[A-Za-z0-9]{20,}' },
            @{ Desc = "Slack token"; Pattern = 'xox[baprs]-[A-Za-z0-9-]{10,}' },
            @{ Desc = "a literal value assigned to a password/secret/api-key-looking variable"; Pattern = '\b(password|passwd|secret|api_key|apikey)\b\s*[:=]\s*"[^"$]{8,}"' }
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }
            foreach ($check in $checks) {
              $found = Select-String -LiteralPath $file -Pattern $check.Pattern -CaseSensitive -ErrorAction SilentlyContinue
              if ($found) {
                Write-Host "::error::Possible $($check.Desc) found in ${file}:"
                foreach ($m in $found) { Write-Host "  line $($m.LineNumber): $($m.Line.Trim())" }
                $hits = 1
              }
            }
          }
          exit $hits
