name: EVE
options:
  bundleIdPrefix: pw.friberg
  developmentLanguage: sv
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  EVE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVE
    info:
      path: EVE/Resources/Info.plist
      properties:
        CFBundleDisplayName: EVE
        CFBundleDevelopmentRegion: sv
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "EVE behöver mikrofonen för att höra vad du säger."
        NSSpeechRecognitionUsageDescription: "EVE behöver taligenkänning för att förstå vad du säger."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.friberg.eve
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
  EVETests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVETests
    dependencies:
      - target: EVE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.friberg.eve.tests
        GENERATE_INFOPLIST_FILE: YES
  EVEUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVEUITests
    dependencies:
      - target: EVE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.friberg.eve.uitests
        TEST_TARGET_NAME: EVE
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EVE:
    build:
      targets:
        EVE: all
    test:
      config: Debug
      targets:
        - EVETests
        - EVEUITests
    run:
      config: Debug
